<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Bass Booster 1000%</title>
    <style>
        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #161925;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 0, 85, 0.2);
        }
        h1 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }
        .file-upload {
            border: 2px dashed #ff0055;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            display: block;
            margin-bottom: 20px;
            background: rgba(255, 0, 85, 0.02);
        }
        .file-upload input { display: none; }
        .control-group { margin-bottom: 20px; }
        .control-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #8a8f9d;
        }
        .control-label span:last-child { color: #ff0055; font-weight: bold; }
        input[type="range"] { width: 100%; height: 6px; accent-color: #ff0055; }
        button {
            width: 100%;
            background: #ff0055;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        }
        button:disabled { background: #2e3244; color: #5d637a; cursor: not-allowed; box-shadow: none; }
        .status { text-align: center; margin-top: 15px; font-size: 14px; color: #8a8f9d; }
        audio { width: 100%; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Bass Booster 1000%</h1>
    
    <label class="file-upload">
        <span id="fileName">Нажмите и выберите аудиофайл</span>
        <input type="file" id="audioFile" accept="audio/*">
    </label>
    <div class="control-group">
        <div class="control-label"><span>Мощность Баса</span><span id="bVal">100%</span></div>
        <input type="range" id="bRange" min="100" max="1000" value="100" step="10">
    </div>

    <div class="control-group">
        <div class="control-label"><span>Качество звука</span><span id="qVal">100%</span></div>
        <input type="range" id="qRange" min="1" max="100" value="100">
    </div>

    <div class="control-group">
        <div class="control-label"><span>Общая громкость</span><span id="volVal">100%</span></div>
        <input type="range" id="volRange" min="0" max="200" value="100">
    </div>

    <div class="control-group">
        <div class="control-label"><span>Скорость (Slowed эффект)</span><span id="speedVal">100%</span></div>
        <input type="range" id="speedRange" min="50" max="150" value="100">
    </div>

    <div class="control-group">
        <div class="control-label"><span>Эхо (Reverb)</span><span id="echoVal">0%</span></div>
        <input type="range" id="echoRange" min="0" max="100" value="0">
    </div>

    <div class="control-group">
        <div class="control-label"><span>Высокие частоты (Treble)</span><span id="trebleVal">0%</span></div>
        <input type="range" id="trebleRange" min="0" max="100" value="0">
    </div>

    <button id="boostBtn" disabled>Взорвать Бас</button>
    <div class="status" id="statusText">Ожидание файла...</div>
    
    <audio id="player" controls></audio>
</div>

<script src="script.js"></script>
</body>
</html>
